{{ define "main" }}
  <div class="container pb-14">
    <!-- Hovedinnhold -->
    <div class="row">
      <div class="col-12 content">
        {{ .Content }}
      </div>
    </div>

    <!-- Profil seksjon -->
    {{ with .Params.profile }}
      <div class="row mt-14 items-center bg-gradient-to-r from-gray-50 to-gray-100 p-8 rounded-lg">
        <div class="md:col-4">
          {{ if .image }}
            <img src="{{ .image }}" alt="{{ .title }}"
                 class="rounded-full w-48 h-48 object-cover mx-auto">
          {{ end }}
        </div>
        <div class="md:col-8">
          <h2 class="text-2xl font-bold mb-4">{{ .title }}</h2>
          <p class="mb-6">{{ .description }}</p>

          {{ with .quote }}
            <blockquote class="border-l-4 border-primary pl-4 italic">
              <p class="mb-2">{{ .text }}</p>
              <footer>
                <strong>{{ .author }}</strong>
                {{ if .position }}
                  <span class="text-gray-600"> - {{ .position }}</span>
                {{ end }}
              </footer>
            </blockquote>
          {{ end }}
        </div>
      </div>
    {{ end }}
  </div>
{{ end }}
